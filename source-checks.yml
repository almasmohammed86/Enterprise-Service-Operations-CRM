name: Source checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify expected project files exist
        run: |
          test -f README.md
          test -f docs/data-model.md
          test -f src/javascript/case-form.js
          test -f src/plugins/EnterpriseServiceOperations.Plugins/CaseValidationPlugin.cs
          test -f docs/test-plan.md
          echo "Required source files are present."
